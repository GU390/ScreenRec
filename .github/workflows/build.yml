name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时创建 Release（填版本号，如 v1.0.0）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ScreenRec (windows-x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore ScreenRec.csproj

      - name: 编译（单文件自包含）
        run: >
          dotnet publish ScreenRec.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out

      - name: 冒烟测试（命令行自测跑 3 秒，确认 exe 能启动）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $exe = Join-Path $out 'ScreenRec.exe'
          if (-not (Test-Path $exe)) { throw "没产出 exe" }
          $size = (Get-Item $exe).Length
          Write-Host "产物大小: $size 字节"
          if ($size -lt 10MB) { throw "产物太小，可能没编全" }
          # ★ WinExe 用 & 启动不会等待，$LASTEXITCODE 会是上一条命令的返回值 —— 必须 Start-Process -Wait
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.avi'
          $p = Start-Process -FilePath $exe `
                -ArgumentList @('--selftest', '--seconds', '3', '--out', $smoke, '--fps', '10', '--quality', '60') `
                -Wait -PassThru -NoNewWindow
          Write-Host "自测退出码: $($p.ExitCode)"
          if (-not (Test-Path $smoke)) { throw "自测没产出文件" }
          $len = (Get-Item $smoke).Length
          Write-Host "自测产物: $len 字节"
          if ($len -lt 4096) { throw "自测产物太小，抓屏/编码链路可能有问题" }

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'out\ScreenRec.exe').Hash.ToLower()
          $size = [math]::Round((Get-Item 'out\ScreenRec.exe').Length / 1MB, 2)
          Write-Host "===== SHA256 ====="
          Write-Host $hash
          Write-Host "===== SIZE ====="
          Write-Host "$size MB"
          Set-Content -LiteralPath 'sha256.txt' -Value ("ScreenRec.exe  SHA256  " + $hash + "  (" + $size + " MB)") -Encoding utf8

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-windows-x64
          path: |
            out/ScreenRec.exe
            sha256.txt
          if-no-files-found: error

      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release != ''
        shell: pwsh
        run: pwsh -File scripts/make-release-notes.ps1

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release != ''
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.publish_release }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.publish_release }}
          draft: false
          prerelease: false
          files: out/ScreenRec.exe
          body_path: release-notes.md
